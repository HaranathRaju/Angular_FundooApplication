<div class="page">
  <mat-card class="forget-card">

    <img
      src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png"
      alt="Google"
      class="google-logo"
    />

    <h2 class="title">Forgot Password</h2>
    <p class="subtitle">Enter your registered email to reset your password.</p>

    <form [formGroup]="forgetForm" (ngSubmit)="onSubmit()">
      <input
        type="email"
        placeholder="Enter your email"
        formControlName="email"
        class="input"
      />
      <small
        class="error"
        *ngIf="forgetForm.get('email')?.touched && forgetForm.get('email')?.invalid">
        Please enter a valid email.
      </small>

      <button mat-raised-button color="primary" type="submit" [disabled]="forgetForm.invalid">
        Send Reset Link
      </button>
    </form>

    <div class="links">
      <a routerLink="/login">Back to Login</a>
      <a routerLink="/register">Create Account</a>
    </div>
  </mat-card>
</div>
